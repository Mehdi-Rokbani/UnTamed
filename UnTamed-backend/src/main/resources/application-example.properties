# Copy the Stripe values into environment variables for local development.
# Do not put real Stripe secrets in committed files.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:eur}
stripe.connect-timeout-ms=${STRIPE_CONNECT_TIMEOUT_MS:5000}
stripe.read-timeout-ms=${STRIPE_READ_TIMEOUT_MS:15000}
